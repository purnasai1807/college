services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canteen
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: canteen
    volumes:
      - canteen-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen -d canteen"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://canteen:${DB_PASSWORD}@db:5432/canteen
      HOSTNAME: 0.0.0.0
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  canteen-data:
